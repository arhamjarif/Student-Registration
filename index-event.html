<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="https://img.freepik.com/premium-photo/vibrant-music-festival-logo-with-neon-colors-musical-icons-dark-background_606187-25826.jpg">
        <title>Event Registration</title>
    </head>
    <body>
        <div id="header">
            <img src="https://img.freepik.com/premium-photo/vibrant-music-festival-logo-with-neon-colors-musical-icons-dark-background_606187-25826.jpg" alt="logo" width="250px">
            <h1>MUSICFEST 2026</h1>
        </div>
        <div id="intro"><p><pre>
MusicFest is coming to AIUB to bring you a night to remember!
Join us on 1st December 2026 and grab your seats to a concert by 6 bands renouned throughout the country!
<b><i>You may only bring 1 person with you per student.</i></b>
<b>Event Date: 1st Decemeber, 2026</b>
<b>8:00 pm - 11:00 pm</b>

        </pre></p></div>
        <h1>REGISTER NOW</h1>
        <div id="regform">
            <form method="get">
                <table>
                    <tr>
                        <td><label for="name">Name</label></td>
                        <td><input type="text" name="name" id="name" placeholder="Enter your full name" required></td>
                    </tr>
                    <tr>
                        <td><label for="id">Student ID</label></td>
                        <td><input type="text" name="id" id="id" placeholder="Enter you student ID" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email</label></td>
                        <td><input type="email" name="email" id="email" placeholder="Enter your email" required></td>
                    </tr>
                    <tr>
                        <td><label for="ticketno">Number of tickets</label></td>
                        <td>
                            <label for="ticketno1">1</label>
                            <input type="radio" name="ticketno" id="ticketno1" value="1" required>
                            <label for="ticketno2">2</label>
                            <input type="radio" name="ticketno" id="ticketno2" value="2">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button type="submit">Register</button></td>
                    </tr>
                </table>
            </form>
        </div>
    </body>
</html>
