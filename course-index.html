
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Page </title>
    <link rel="stylesheet" href="course-style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Student Course Registration System </h1>
    <p class="center"> Register for your desired courses </p>

    <div class="form-box">

        <h2>Student Login</h2>

        <form id="loginForm" action="course-dashboard.html" method="get" novalidate> 

            <label for="studentid">Student ID</label>
            <input type="text" id="studentid" placeholder="Enter your student ID" required><br><br>

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter your name" required><br><br>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email" required><br><br>

            <button type="submit" id="loginBtn">Login</button>
          <button type="reset" class="reset-button">Reset</button>

        </form>

        <p id="message"> </p>

        <p class="small-text">
            Please enter your information to continue.
        </p>

    </div>

</body>
</html>
